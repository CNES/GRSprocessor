name: Pipeline CI

on:
  push:
    branches:
      - 'feature/*'
      - 'release/*'
      - 'hotfix/*'
      - 'bugfix/*'
      - main
      - develop
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - develop


env:
  DOCKER_IMAGE_NAME : "grs"

jobs:
# =============================================================================
# test
# =============================================================================
  python-tests:
   runs-on: ubuntu-latest
   steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the gdal package
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install dependencies and run tests
        run: |
          echo "Creating the python environment"
          python -m venv python_env
          . python_env/bin/activate
          python -m pip install --upgrade pip
          GDAL_VERSION=$(gdal-config --version)
          echo "GDAL system version: $GDAL_VERSION"

          echo "Installing dependencies via pip"
          python -m pip install GDAL==$GDAL_VERSION
          python -m pip install -r requirements.txt --no-cache-dir --force-reinstall
          python -m pip install pytest pytest-cov
          python -m pip install -U datashader # requirements.txt's version is no longer compatible with dask

          echo "Running tests in grs/tests/integration_tests/"
          python -m pytest --tb=short -vv -s -x grs/tests/integration_tests/ --cov=grs --cov-report=html:cov_html --cov-report=xml:coverage.xml --junitxml=test-results.xml

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "Generating the coverage badge"
            python -m pip install genbadge[coverage]

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Checking out a tag leaves the repo in detached HEAD: we can't
            # "git push" directly from there. So we switch to main (the branch
            # tags are cut from) before committing the badge.
            git fetch origin main
            git checkout -B main origin/main

            mkdir -p badges
            genbadge coverage -i coverage.xml -o badges/coverage.svg

            git add badges/coverage.svg

            if ! git diff --cached --quiet; then
              git commit -m "Update coverage badge [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: false
        #if: always()   # Upload even if tests fail
        with:
          name: test-reports
          path : |
            coverage.xml
            test-results.xml
            cov_html/
          retention-days: 1

# =============================================================================
# package — Publish to PyPI
# =============================================================================
  pypi:
    needs: python-tests
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name : Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

# =============================================================================
# package — Build & Publish to Docker Hub
# =============================================================================
  podman-build:
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}"
          export VERSION_GRS=$(grep version pyproject.toml | cut -d '"' -f 2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag : $GITHUB_REF_NAME"
            export VERSION_GRS=${GITHUB_REF_NAME};
          fi
          echo "Version GRS -> ${VERSION_GRS}"
          echo "VERSION_GRS=${VERSION_GRS}" >> "$GITHUB_ENV"

          podman build \
            --network=host \
            --build-arg IMAGE_SOURCE="" \
            --build-arg no_proxy=cnes.fr \
            --file Dockerfile-github \
            --tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" \
            --tag "${DOCKER_IMAGE_NAME}:latest"
          echo "Build complete"

      - name: Publish version tag + latest to Docker Hub (release)
        if: github.ref_type == 'tag'
        run: |
          echo "Logging in to docker.io"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io \
              -u "${{ secrets.DOCKERHUB_LOGIN }}" \
              --password-stdin

          podman tag ${DOCKER_IMAGE_NAME}:${VERSION_GRS} docker.io/cnes/${DOCKER_IMAGE_NAME}:${VERSION_GRS}
          podman tag ${DOCKER_IMAGE_NAME}:latest docker.io/cnes/${DOCKER_IMAGE_NAME}:latest

          echo "Publishing ${DOCKER_IMAGE_NAME}:${VERSION_GRS} to docker.io"
          podman push docker.io/cnes/${DOCKER_IMAGE_NAME}:${VERSION_GRS}
          echo "Publishing ${DOCKER_IMAGE_NAME}:latest to docker.io"
          podman push docker.io/cnes/${DOCKER_IMAGE_NAME}:latest

      - name: Publish dev image to Docker Hub (develop)
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: |
          echo "Logging in to docker.io"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io \
              -u "${{ secrets.DOCKERHUB_LOGIN }}" \
              --password-stdin

          podman tag ${DOCKER_IMAGE_NAME}:${VERSION_GRS} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:dev
          echo "Publishing ${DOCKER_IMAGE_NAME}:dev to docker.io"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:dev

      - name: Publish dev image to Docker Hub (hotfix)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'hotfix/')
        run: |
          echo "Logging in to docker.io"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io \
              -u "${{ secrets.DOCKERHUB_LOGIN }}" \
              --password-stdin

          podman tag ${DOCKER_IMAGE_NAME}:${VERSION_GRS} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:dev
          echo "Publishing ${DOCKER_IMAGE_NAME}:dev to docker.io"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:dev


# =============================================================================
# quality
# =============================================================================

  lint:
    if: github.event_name == 'pull_request' || github.ref_type == 'tag'
    needs: podman-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name : Install ruff and mypy
        run: pip install ruff mypy

      - name: Run ruff
        continue-on-error: true
        run: ruff check . --output-format=json > ruff-report.json

      - run: pip install -r requirements.txt

      - name: Run mypy
        continue-on-error: true
        run: mypy . --junit-xml mypy-report.xml

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            ruff-report.json
            mypy-report.xml
          retention-days: 1



  # The "sync" job to GitLab has been moved to the dedicated workflow
  # .github/workflows/gitlab-sync.yml: direct push is rejected on GitLab's
  # protected main/develop branches (pre-receive hook), replaced by a
  # PR -> GitLab branch -> GitLab Merge Request flow.

